      <button onclick="sendSnapshot()" id="snap-btn" style="font-family:'DM Mono',monospace;font-size:.68rem;letter-spacing:.1em;text-transform:uppercase;background:#0D0D0D;color:#F8F6F1;border:none;padding:.85rem;cursor:pointer;transition:background .2s;width:100%;">Send to My Inbox →</button>
    </div>

    <p style="font-size:.68rem;color:#D8D4CC;margin-top:.8rem;font-family:'DM Mono',monospace;letter-spacing:.05em;">We never spam. One email, no follow-up.</p>

<script>
/* scroll reveal */
const obs=new IntersectionObserver(e=>{e.forEach(x=>{if(x.isIntersecting)x.target.classList.add('on');});},{threshold:0.08,rootMargin:'0px 0px -30px 0px'});
document.querySelectorAll('.reveal').forEach(el=>obs.observe(el));

/* nav shadow */
window.addEventListener('scroll',()=>{const n=document.getElementById('nav');if(n)n.style.boxShadow=window.scrollY>10?'0 1px 0 #D8D4CC':'none';});

/* mobile menu */
function toggleMenu(){const m=document.getElementById('mobileNav');m.classList.toggle('open');document.body.style.overflow=m.classList.contains('open')?'hidden':'';}

/* hero word rotator */
const heroWords=['Generative Era','AI-First World','LLM Economy','Semantic Web'];
let hwi=0;
const hwEl=document.getElementById('era-word');
if(hwEl){setInterval(()=>{hwEl.style.opacity='0';hwEl.style.transform='translateY(-10px)';setTimeout(()=>{hwi=(hwi+1)%heroWords.length;hwEl.textContent=heroWords[hwi];hwEl.style.transform='translateY(8px)';setTimeout(()=>{hwEl.style.opacity='1';hwEl.style.transform='translateY(0)';},50);},220);},3000);}

/* AI crawler rotator */
const crawlers=['GPTBot','ClaudeBot','PerplexityBot','Googlebot','Bingbot'];
const lats=[142,98,203,87,156];
let ci=0;
function rotateCrawler(){const el=document.getElementById('active-crawler');const la=document.getElementById('crawler-lat');if(el){ci=(ci+1)%crawlers.length;el.textContent=crawlers[ci];la.textContent=lats[ci]+'ms';}}
setInterval(rotateCrawler,2800);

/* counter animation */
function animateCounter(el,target,suffix){let cur=0;const step=target/60;const t=setInterval(()=>{cur=Math.min(cur+step,target);el.textContent=Math.floor(cur).toLocaleString()+(suffix||'');if(cur>=target)clearInterval(t);},25);}
const obs2=new IntersectionObserver(e=>{e.forEach(x=>{if(x.isIntersecting){x.target.querySelectorAll('[data-count]').forEach(c=>{animateCounter(c,parseInt(c.dataset.count),c.dataset.suffix||'');});obs2.unobserve(x.target);}});});
document.querySelectorAll('.metric-grid,.intelligence-grid').forEach(el=>obs2.observe(el));

/* =====================================================
   HIGHLIGHTER CURSOR + SNAPSHOT EMAIL
   - Amber book-highlighter follows mouse
   - Highlights fade after 7s
   - After highlighting text, modal offers to email snapshot
   ===================================================== */
(function(){
  if(window.innerWidth<=768) return;

  var FADE=7000;

  /* — Canvas — */
  var cv=document.createElement('canvas');
  cv.setAttribute('style','position:fixed;top:0;left:0;pointer-events:none;z-index:1;');
  document.body.appendChild(cv);
  var ctx=cv.getContext('2d');
  var W=window.innerWidth, H=window.innerHeight;
  cv.width=W; cv.height=H;
  window.addEventListener('resize',function(){W=cv.width=window.innerWidth;H=cv.height=window.innerHeight;});

  /* — Highlighter visual element — */
  var hl=document.createElement('div');
  hl.setAttribute('style','position:fixed;top:0;left:0;width:34px;height:18px;background:rgba(232,160,32,0.3);border-radius:3px;pointer-events:none;z-index:9998;display:none;transform:translate(-17px,-9px);');
  document.body.appendChild(hl);

  /* — Small dot cursor — */
  var dot=document.createElement('div');
  dot.setAttribute('style','position:fixed;top:0;left:0;width:7px;height:7px;background:#E8A020;border-radius:50%;pointer-events:none;z-index:9999;transform:translate(-50%,-50%);');
  document.body.appendChild(dot);

  /* — Hide system cursor — */
  var sty=document.createElement('style');
  sty.textContent='html,body,*{cursor:none!important;}';
  document.head.appendChild(sty);

  /* — Snapshot modal — */
  var modalHTML='<div id="hlModal" style="display:none;position:fixed;inset:0;background:rgba(13,13,13,0.8);z-index:99999;align-items:center;justify-content:center;">'
    +'<div style="background:#F8F6F1;max-width:400px;width:90%;padding:2.5rem;position:relative;border-top:3px solid #E8A020;">'
    +'<button id="hlClose" style="position:absolute;top:.8rem;right:1rem;background:none;border:none;font-size:1.3rem;color:#6B6B6B;line-height:1;">✕</button>'
    +'<div style="font-family:'DM Mono',monospace;font-size:.56rem;letter-spacing:.2em;text-transform:uppercase;color:#E8A020;margin-bottom:.6rem;">Your highlights</div>'
    +'<h3 style="font-family:'Playfair Display',serif;font-weight:900;font-size:1.3rem;color:#0D0D0D;margin-bottom:.5rem;line-height:1.2;">We captured your reading trail.</h3>'
    +'<p style="font-size:.8rem;color:#6B6B6B;line-height:1.7;margin-bottom:1.2rem;">Want us to send this snapshot to your inbox?</p>'
    +'<canvas id="hlPreview" style="width:100%;height:120px;border:1px solid #D8D4CC;margin-bottom:1rem;background:#fff;display:block;"></canvas>'
    +'<div id="hlForm" style="display:flex;gap:.6rem;">'
    +'<input id="hlEmail" type="email" placeholder="your@email.com" style="flex:1;border:1px solid #D8D4CC;padding:.7rem .9rem;font-family:'DM Sans',sans-serif;font-size:.83rem;outline:none;min-width:0;"/>'
    +'<button id="hlSend" style="font-family:'DM Mono',monospace;font-size:.65rem;letter-spacing:.08em;text-transform:uppercase;background:#0D0D0D;color:#F8F6F1;border:none;padding:.7rem 1.2rem;white-space:nowrap;">Send →</button>'
    +'</div>'
    +'<div id="hlOk" style="display:none;font-family:'DM Mono',monospace;font-size:.7rem;color:#1D9E75;padding:.7rem;background:rgba(29,158,117,.08);border:1px solid rgba(29,158,117,.2);margin-top:.6rem;">✓ Sent! Check your inbox.</div>'
    +'<p style="font-size:.62rem;color:#D8D4CC;margin-top:.7rem;font-family:'DM Mono',monospace;">One email only. No follow-up.</p>'
    +'</div></div>';
  document.body.insertAdjacentHTML('beforeend',modalHTML);

  /* — State — */
  var mx=-999, my=-999, pmx=-999, pmy=-999;
  var isOnText=false;
  var strokes=[];
  var snapShown=false;
  var snapTimer=null;
  var lastTextTime=0;

  var TEXT_TAGS={H1:1,H2:1,H3:1,H4:1,H5:1,H6:1,P:1,SPAN:1,A:1,LI:1,STRONG:1,EM:1,LABEL:1,BLOCKQUOTE:1,DIV:1};

  function checkText(el){
    if(!el) return false;
    if(TEXT_TAGS[el.tagName]) return true;
    for(var n=el.firstChild;n;n=n.nextSibling){
      if(n.nodeType===3 && n.nodeValue.trim().length>0) return true;
    }
    return false;
  }

  /* — Render loop — */
  function render(){
    requestAnimationFrame(render);
    ctx.clearRect(0,0,W,H);
    var now=Date.now();
    strokes=strokes.filter(function(s){return now-s.t<FADE;});
    for(var i=0;i<strokes.length;i++){
      var s=strokes[i];
      var alpha=1-(now-s.t)/FADE;
      if(s.txt){
        ctx.beginPath();ctx.moveTo(s.x1,s.y1);ctx.lineTo(s.x2,s.y2);
        ctx.strokeStyle='rgba(232,160,32,'+(alpha*0.35)+')';
        ctx.lineWidth=18;ctx.lineCap='round';ctx.stroke();
        ctx.beginPath();ctx.moveTo(s.x1,s.y1);ctx.lineTo(s.x2,s.y2);
        ctx.strokeStyle='rgba(200,130,0,'+(alpha*0.1)+')';
        ctx.lineWidth=5;ctx.stroke();
      } else {
        ctx.beginPath();ctx.moveTo(s.x1,s.y1);ctx.lineTo(s.x2,s.y2);
        ctx.strokeStyle='rgba(232,160,32,'+(alpha*0.08)+')';
        ctx.lineWidth=2;ctx.lineCap='round';ctx.stroke();
      }
    }
  }
  render();

  /* — Mouse move — */
  document.addEventListener('mousemove',function(e){
    mx=e.clientX; my=e.clientY;
    dot.style.left=mx+'px'; dot.style.top=my+'px';
    hl.style.left=mx+'px'; hl.style.top=my+'px';

    var el=document.elementFromPoint(mx,my);
    isOnText=checkText(el);

    if(isOnText){
      hl.style.display='block';
      dot.style.opacity='0';
      lastTextTime=Date.now();
    } else {
      hl.style.display='none';
      dot.style.opacity='1';
    }

    var dist=Math.hypot(mx-pmx,my-pmy);
    if(dist>1 && pmx>-900){
      strokes.push({x1:pmx,y1:pmy,x2:mx,y2:my,t:Date.now(),txt:isOnText});
    }
    pmx=mx; pmy=my;

    /* Trigger snapshot modal after highlighting */
    if(isOnText && !snapShown){
      clearTimeout(snapTimer);
      snapTimer=setTimeout(function(){
        var textStrokes=strokes.filter(function(s){return s.txt;});
        if(textStrokes.length>10 && Date.now()-lastTextTime<3000){
          snapShown=true;
          showModal();
        }
      },2500);
    }
  });

  document.addEventListener('mouseleave',function(){
    dot.style.opacity='0';
    hl.style.display='none';
  });

  /* — Modal — */
  function showModal(){
    var modal=document.getElementById('hlModal');
    if(!modal) return;
    modal.style.display='flex';
    drawPreview();
  }

  function drawPreview(){
    var pv=document.getElementById('hlPreview');
    if(!pv) return;
    var pw=pv.offsetWidth||360, ph=120;
    pv.width=pw*2; pv.height=ph*2;
    var pc=pv.getContext('2d');
    pc.scale(2,2);
    pc.fillStyle='#FFFFFF'; pc.fillRect(0,0,pw,ph);
    var now=Date.now();
    var sx=pw/W, sy=ph/H;
    strokes.forEach(function(s){
      var alpha=Math.max(0,1-(now-s.t)/FADE);
      if(s.txt){
        pc.beginPath();pc.moveTo(s.x1*sx,s.y1*sy);pc.lineTo(s.x2*sx,s.y2*sy);
        pc.strokeStyle='rgba(232,160,32,'+(alpha*0.5)+')';
        pc.lineWidth=9;pc.lineCap='round';pc.stroke();
      }
    });
  }

  document.getElementById('hlClose').addEventListener('click',function(){
    document.getElementById('hlModal').style.display='none';
  });

  document.getElementById('hlSend').addEventListener('click',function(){
    var email=document.getElementById('hlEmail').value.trim();
    if(!email||!email.includes('@')) return;
    var btn=document.getElementById('hlSend');
    btn.textContent='Sending...'; btn.disabled=true;
    fetch('https://formspree.io/f/mwvwlnav',{
      method:'POST',
      headers:{'Content-Type':'application/json','Accept':'application/json'},
      body:JSON.stringify({email:email,message:'Highlight snapshot request from flipflopsolution.com',_replyto:email,time:new Date().toLocaleString()})
    }).then(function(r){
      if(r.ok){
        document.getElementById('hlForm').style.display='none';
        document.getElementById('hlOk').style.display='block';
      } else {btn.textContent='Error — retry';btn.disabled=false;}
    }).catch(function(){btn.textContent='Network error';btn.disabled=false;});
  });

})();
</script>
</body>
